/* Layout: cabeçalho limpo com logo oficial, hero em duas colunas com destaque da marca, vitrine em grade de cartões. */
:root{
  color-scheme: light;
  --bg:#FFFFFF; --surface:#FFFFFF; --fg:#0B192C; --muted:#5A6A80; --line:#E6ECF5;
  --accent:#0C4A8A; --accent-fg:#FFFFFF; --accent-soft:#F2F6FB; --amber:#F58220;
  --wa:#0B7F43; --wa-fg:#FFFFFF; --danger:#B42318; --danger-soft:#FDE8E6; --ok-soft:#DFF5E8;
  --font-display:'Unbounded',system-ui,sans-serif; --font-body:'Instrument Sans',system-ui,sans-serif;
}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 var(--font-body);-webkit-font-smoothing:antialiased}
img{display:block}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{width:100%;max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{margin:0;font-family:var(--font-display);letter-spacing:-.015em;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:10px;border:1.5px solid transparent;font:600 15px/1 var(--font-body);cursor:pointer;text-decoration:none;white-space:nowrap;transition:transform .15s ease,background .15s ease}
.btn:hover{transform:translateY(-1px)}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-fg)}
.btn.wa{background:var(--wa);color:var(--wa-fg)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--fg)}
.btn.light{background:var(--surface);color:var(--fg)}
.btn.danger{background:var(--danger-soft);color:var(--danger);border-color:var(--danger)}
.btn.block{width:100%}
.btn svg{flex:none}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px}
.brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;font:700 17px/1 var(--font-display);letter-spacing:-.02em;color:var(--fg)}
.brand-img{width:36px;height:36px;border-radius:50%;object-fit:cover;border:1px solid var(--line);box-shadow:0 2px 6px rgba(0,0,0,.08);flex:none}
.nav{display:flex;gap:6px;overflow-x:auto;padding-block:0 10px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{padding:8px 14px;border-radius:999px;font-weight:600;font-size:14.5px;color:var(--muted);text-decoration:none;white-space:nowrap}
.nav a:hover{color:var(--fg)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}

/* hero */
.hero{position:relative;overflow:hidden;padding-block:36px 30px}
.hero-in{display:grid;grid-template-columns:1.1fr .9fr;gap:32px;align-items:center}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--amber)}
.eyebrow::before{content:"";width:22px;height:3px;border-radius:3px;background:var(--accent)}
.hero h1{margin-top:14px;font-size:clamp(28px,5.2vw,50px);line-height:1.06;font-weight:700}
.hero h1 em{font-style:normal;color:var(--amber)}
.lead{margin-top:16px;max-width:52ch;font-size:clamp(16px,2vw,18px);color:var(--muted)}
.cta-row{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}
.vis{position:relative;width:100%;max-width:390px;aspect-ratio:1;margin-inline:auto;display:flex;align-items:center;justify-content:center}
.ring{position:absolute;inset:0;width:100%;height:100%;animation:spin 16s linear infinite;transform-origin:center center;pointer-events:none;z-index:1}
@keyframes spin{to{transform:rotate(360deg)}}
.streak{position:absolute;height:3.5px;border-radius:3px;background:var(--amber);z-index:1}
.streak.s1{width:56px;left:-6px;top:23%}
.streak.s2{width:36px;left:8px;top:30%;opacity:.65}
.streak.s3{width:46px;right:-4px;bottom:30%;opacity:.85}
.phone{position:absolute;left:50%;top:50%;width:45%;aspect-ratio:9/18.5;transform:translate(-50%,-50%) rotate(-6.5deg);border-radius:26px;background:#0B132B;padding:6px;box-shadow:0 22px 48px -10px rgba(12,74,138,.35),0 0 0 1px rgba(11,19,43,.2);z-index:2;display:flex;flex-direction:column;animation:phoneGiro 8.5s cubic-bezier(0.4,0,0.2,1) infinite;transform-origin:center center;will-change:transform}
.phone:hover{animation-play-state:paused}
@keyframes phoneGiro{
  0%,68%{transform:translate(-50%,-50%) rotate(-6.5deg) scale(1)}
  73%{transform:translate(-50%,-50%) rotate(-14deg) scale(1.04)}
  86%{transform:translate(-50%,-50%) rotate(353.5deg) scale(1.04)}
  92%{transform:translate(-50%,-50%) rotate(-3.5deg) scale(1.01)}
  100%{transform:translate(-50%,-50%) rotate(-6.5deg) scale(1)}
}
.phone-notch{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:34px;height:6px;background:#0B132B;border-radius:999px;z-index:4}
.phone-screen{position:relative;width:100%;height:100%;border-radius:20px;background:#FFFFFF;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:12px 6px;box-sizing:border-box;box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
.phone-screen-logo{width:98%;height:auto;max-height:90%;object-fit:contain;display:block}
.phone-bar{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);width:32px;height:3px;background:#cbd5e1;border-radius:999px;z-index:3}
.pill{position:absolute;padding:8px 16px;border-radius:999px;background:#FFFFFF;border:1px solid var(--line);font-weight:700;font-size:13.5px;color:var(--fg);box-shadow:0 8px 22px -6px rgba(12,74,138,.22);z-index:3;white-space:nowrap;user-select:none}
.pill.a{top:8%;right:2%}.pill.b{bottom:9%;right:2%}.pill.c{left:-2%;top:48%}

/* sections */
.sec{padding-block:26px}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:8px 16px;margin-bottom:16px}
.sec-h h2,.page-h h1{font-size:clamp(20px,3.4vw,28px);line-height:1.15;font-weight:700}
.page-h{padding-block:28px 8px}
.page-h p{margin-top:8px;color:var(--muted);max-width:60ch}
.link{font-weight:600;font-size:14.5px;color:var(--accent);text-decoration:none}
.link:hover{text-decoration:underline}

.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:12px}
.cat{display:flex;flex-direction:column;gap:6px;text-align:left;padding:16px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;cursor:pointer;min-width:0}
.cat:hover{border-color:var(--accent)}
.cat b{font:700 16px/1.2 var(--font-display);letter-spacing:-.01em}
.cat span{font-size:14px;color:var(--muted)}
.cat.soon{border-style:dashed;background:transparent;cursor:default}
.cat.soon:hover{border-color:var(--line)}

/* product grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr));gap:12px}
@media (min-width:640px){.grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:18px}}
.card{display:flex;flex-direction:column;min-width:0;border:1px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden}
.card-img{position:relative;display:block;aspect-ratio:4/3;background:var(--accent-soft)}
.card-img img{width:100%;height:100%;object-fit:cover}
.soon-tag{position:absolute;left:8px;bottom:8px;padding:3px 9px;border-radius:999px;background:rgba(10,17,31,.72);color:#fff;font-size:11.5px;font-weight:600}
.feat-tag{position:absolute;left:8px;top:8px;padding:3px 9px;border-radius:999px;background:var(--amber);color:#2A1D00;font-size:11.5px;font-weight:700}
.card-b{display:flex;flex-direction:column;gap:8px;padding:12px;flex:1}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{padding:2px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:12px;font-weight:600}
.tag.n{background:transparent;border:1px solid var(--line);color:var(--muted)}
.card h3{font:700 15px/1.25 var(--font-display);letter-spacing:-.01em}
.card h3 a{text-decoration:none}
.card .desc{font-size:14px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-act{display:flex;flex-direction:column;gap:6px;margin-top:auto;padding-top:4px}
.card-act .link{text-align:center;padding:4px 0}

/* steps + band */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.step{padding:18px;border-radius:14px;border:1px solid var(--line);background:var(--surface)}
.step .n{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--amber);color:#FFFFFF;font-weight:700;font-size:14px}
.step h3{margin-top:12px;font-size:16px}
.step p{margin-top:6px;color:var(--muted);font-size:15px}
.band{margin-block:26px 36px;padding:28px;border-radius:20px;background:#FFFFFF;border:2px solid var(--line);color:var(--fg);display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:16px;box-shadow:0 12px 30px -10px rgba(12,74,138,.08)}
.band h2{font-size:clamp(18px,3vw,24px);line-height:1.2;color:var(--accent)}
.band p{margin-top:6px;color:var(--muted);max-width:50ch}
.band .btn.light{background:var(--accent);color:#fff}
.band .btn.light:hover{background:#083563}

/* catalog controls */
.filters{display:grid;gap:12px;padding-block:14px}
.filters-row{display:flex;flex-wrap:wrap;gap:10px}
.search{flex:1 1 240px;min-width:0}
input,select,textarea{font:inherit;color:var(--fg)}
.inp{width:100%;min-height:44px;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);font-size:16px}
textarea.inp{min-height:96px;resize:vertical}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);font:600 14px var(--font-body);color:var(--fg);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.count{font-size:14px;color:var(--muted);margin-bottom:12px}
.empty{padding:34px 18px;border:1px dashed var(--line);border-radius:16px;text-align:center;display:grid;gap:12px;justify-items:center}
.empty h3{font-size:17px}

/* product page */
.crumbs{padding-top:18px;font-size:14px;color:var(--muted)}
.crumbs a{color:var(--accent);text-decoration:none;font-weight:600}
.pd{display:grid;grid-template-columns:1.05fr .95fr;gap:28px;padding-block:16px 24px;align-items:start}
.pd-main{aspect-ratio:4/3;border-radius:18px;overflow:hidden;background:var(--accent-soft);border:1px solid var(--line)}
.pd-main img{width:100%;height:100%;object-fit:cover}
.thumbs{display:flex;gap:8px;margin-top:10px;overflow-x:auto}
.thumb{flex:none;width:72px;aspect-ratio:4/3;padding:0;border-radius:10px;overflow:hidden;border:2px solid transparent;background:var(--accent-soft);cursor:pointer}
.thumb[aria-current="true"]{border-color:var(--accent)}
.thumb img{width:100%;height:100%;object-fit:cover}
.pd h1{margin-top:10px;font-size:clamp(22px,4vw,34px);line-height:1.12}
.pd .body{margin-top:14px;display:grid;gap:10px;color:var(--fg)}
.specs{margin:18px 0 0;display:grid;grid-template-columns:auto 1fr;gap:8px 18px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.specs dt{color:var(--muted);font-size:14px}.specs dd{margin:0;font-weight:600}
.pd-cta{display:grid;gap:10px;margin-top:20px}
.note{margin-top:12px;font-size:14px;color:var(--muted)}

/* contact */
.ct-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:14px}
.box{padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--surface);min-width:0}
.num{display:block;margin-top:6px;font:700 clamp(20px,4vw,26px)/1.2 var(--font-display);letter-spacing:-.01em;user-select:all;word-break:break-word}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.reasons{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px;margin-top:12px}

/* footer */
.foot{margin-top:24px;padding-block:22px 28px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}
.foot-in{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:center;justify-content:space-between}
.foot nav{display:flex;flex-wrap:wrap;gap:6px 18px}
.foot a{text-decoration:none}.foot a:hover{color:var(--fg)}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:50;max-width:min(92vw,460px);padding:12px 18px;border-radius:12px;background:var(--fg);color:var(--bg);font-weight:600;font-size:14.5px;box-shadow:0 14px 30px -12px rgba(0,0,0,.5)}

/* admin */
.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:6px 14px}
.tab{flex:none;min-height:40px;padding:0 16px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);font:600 14.5px var(--font-body);color:var(--fg);cursor:pointer}
.tab[aria-selected="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.stack{display:grid;gap:10px}
.arow{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.arow .th{width:64px;aspect-ratio:4/3;border-radius:8px;object-fit:cover;background:var(--accent-soft);flex:none}
.arow .grow{flex:1 1 180px;min-width:0}
.arow .grow b{display:block;overflow-wrap:anywhere}
.arow .acts{display:flex;flex-wrap:wrap;gap:8px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px}
.field{display:grid;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
.field>label,.lbl{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.02em}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-weight:600}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.photos{display:flex;flex-wrap:wrap;gap:10px}
.ph{width:112px;display:grid;gap:6px}
.ph img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.ph .btn{min-height:34px;padding:0 8px;font-size:13px}
.panel{padding:18px;border:1px solid var(--line);border-radius:16px;background:var(--surface);display:grid;gap:16px}
.alert{padding:12px 14px;border-radius:12px;background:var(--accent-soft);color:var(--fg);font-size:14.5px}
.alert.warn{background:var(--danger-soft)}
.alert.ok{background:var(--ok-soft)}
.pubbar{position:sticky;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:15;margin-top:18px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:12px 14px;border-radius:14px;background:var(--fg);color:var(--bg)}
.pubbar span{flex:1 1 200px;font-weight:600}
.pubbar .btn.ghost{border-color:rgba(127,127,127,.5);color:var(--bg)}
.hr{height:1px;background:var(--line);border:0;margin:4px 0}

@media (max-width:820px){
  .hero-in,.pd{grid-template-columns:1fr}
  .vis{max-width:300px}
  .steps{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.ring,.phone{animation:none}.btn{transition:none}html{scroll-behavior:auto}}
</style>
</head>

/* ---------- helpers ---------- */
function fmtPhone(d){d=digits(d);if(d.length===10||d.length===11)d='55'+d;if(d.indexOf('55')===0&&(d.length===12||d.length===13)){return '+55 '+d.slice(2,4)+' '+d.slice(4,d.length-4)+'-'+d.slice(-4)}return d?'+'+d:''}
function activeContacts(){return (S.settings.contacts||[]).filter(function(c){return c.active&&digits(c.number)})}
function pickContact(id){
  var a=activeContacts();
  if(!a.length)return (S.settings.contacts||[])[0]||null;
  if(id){var found=a.filter(function(c){return c.id===id})[0];if(found)return found}
  return S.settings.mode==='alternado'?a[Math.floor(Math.random()*a.length)]:a[0];
}
function contactFor(pOrId){
  if(!pOrId)return pickContact();
  var id=typeof pOrId==='object'?(pOrId.contactId||''):pOrId;
  return pickContact(id);
}
function contactName(pOrId){
  if(!pOrId)return '';
  var id=typeof pOrId==='object'?(pOrId.contactId||''):pOrId;
  var c=(S.settings.contacts||[]).filter(function(x){return x.id===id})[0];
  return c?c.label:'';
}
function wa(msg,pOrId){var c=contactFor(pOrId);return c?'https://wa.me/'+digits(c.number)+'?text='+encodeURIComponent(msg):'#catalogo'}
function fill(t,p){return String(t||'').replace(/\{produto\}/g,p?p.name:'')}
function catName(id){var c=S.categories.filter(function(x){return x.id===id})[0];return c?c.name:''}
function prodsOf(id){return S.products.filter(function(p){return p.name&&(!id||p.categoryId===id)})}
function hue(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;return h}
function art(p){
  var h=hue((p.brand||'')+(p.model||p.name||'x'));
  var svg="<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 400 300'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='hsl("+h+" 55% 90%)'/><stop offset='1' stop-color='hsl("+((h+30)%360)+" 60% 78%)'/></linearGradient><linearGradient id='s' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='hsl("+h+" 70% 62%)'/><stop offset='1' stop-color='hsl("+((h+50)%360)+" 70% 45%)'/></linearGradient></defs><rect width='400' height='300' fill='url(#g)'/><g transform='rotate(-8 200 150)'><rect x='140' y='34' width='120' height='232' rx='20' fill='hsl("+h+" 30% 16%)'/><rect x='148' y='44' width='104' height='212' rx='13' fill='url(#s)'/><rect x='187' y='50' width='26' height='6' rx='3' fill='hsl("+h+" 30% 16%)'/></g></svg>";
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}
function photos(p){return p.photos&&p.photos.length?p.photos:[art(p)]}
function cover(p){return photos(p)[0]}
function toast(msg){var t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(function(){t.hidden=true},3600)}

/* ---------- routing ---------- */
function parseHash(){
  var h='';try{h=location.hash.slice(1)}catch(e){}
  if(h.indexOf('produto-')===0){route='produto';params.id=h.slice(8)}
  else if(['inicio','catalogo','categorias','admin'].indexOf(h)>-1)route=h;
  else route='inicio';
}
function go(r){
  var cur='';try{cur=location.hash.slice(1)}catch(e){}
  if(cur===r){parseHash();render();window.scrollTo(0,0);return}
  try{location.hash=r}catch(e){parseHash();render();window.scrollTo(0,0)}
}
window.addEventListener('hashchange',function(){parseHash();gal=0;render();window.scrollTo(0,0)});

function catalog(){
  var inCat=prodsOf(F.cat);
  var brands=[];inCat.forEach(function(p){if(p.brand&&brands.indexOf(p.brand)<0)brands.push(p.brand)});brands.sort();
  if(F.brand&&brands.indexOf(F.brand)<0)F.brand='';
  var chips='<button class="chip" data-action="chip" data-id="" aria-pressed="'+(!F.cat)+'">Todos</button>'+S.categories.filter(function(c){return prodsOf(c.id).length}).map(function(c){return '<button class="chip" data-action="chip" data-id="'+esc(c.id)+'" aria-pressed="'+(F.cat===c.id)+'">'+esc(c.name)+'</button>'}).join('');
  return '<div class="wrap"><div class="page-h"><h1>Catálogo</h1><p>Valores e condições são combinados direto no WhatsApp.</p></div><div class="filters"><div class="filters-row"><div class="search"><label class="sr" for="q">Buscar produto</label><input class="inp" id="q" type="search" placeholder="Buscar por nome, marca ou modelo" value="'+esc(F.q)+'" data-q autocomplete="off"></div><div><label class="sr" for="brand">Marca</label><select class="inp" id="brand" data-brand><option value="">Todas as marcas</option>'+brands.map(function(b){return '<option'+(F.brand===b?' selected':'')+'>'+esc(b)+'</option>'}).join('')+'</select></div></div><div class="chips" role="group" aria-label="Categorias">'+chips+'</div></div><p class="count" id="count" aria-live="polite"></p><div id="grid"></div></div>';
}
function visible(){
  var q=norm(F.q);
  return S.products.filter(function(p){
    if(!p.name)return false;
    if(F.cat&&p.categoryId!==F.cat)return false;
    if(F.brand&&p.brand!==F.brand)return false;
    if(F.seller&&p.contactId!==F.seller)return false;
    if(!q)return true;
    return norm([p.name,p.brand,p.model,p.description,catName(p.categoryId)].join(' ')).indexOf(q)>-1;
  });
}
function renderGrid(){
  var g=$('#grid');if(!g)return;
  var list=visible();
  $('#count').textContent=list.length+(list.length===1?' produto encontrado':' produtos encontrados');
  g.innerHTML=list.length?'<div class="grid">'+list.map(card).join('')+'</div>':'<div class="empty"><h3>Nenhum produto com esses filtros</h3><p class="muted">Limpe os filtros ou pergunte à equipe se o item chega em breve.</p><div class="cta-row" style="margin:0;justify-content:center"><button class="btn ghost" data-action="clear">Limpar filtros</button><a class="btn wa" target="_blank" rel="noopener" href="'+esc(wa('Olá! Procuro um produto que não encontrei no catálogo da Giro Rápido.'))+'">'+CHAT+'Perguntar no WhatsApp</a></div></div>';
}

function product(){
  var p=S.products.filter(function(x){return x.id===params.id})[0];

  var ph=photos(p);if(gal>=ph.length)gal=0;
  var specs=[
    ['Marca',p.brand],
    ['Modelo',p.model],
    ['Categoria',catName(p.categoryId)],
    ['Condição',p.condition]
  ].filter(function(s){return s[1]});
  var rel=prodsOf(p.categoryId).filter(function(x){return x.id!==p.id}).slice(0,4);
  var paras=String(p.description||'').split(/\n+/).filter(Boolean).map(function(t){return '<p>'+esc(t)+'</p>'}).join('');

}

function editor(p){

  var opts=S.categories.map(function(c){return '<option value="'+esc(c.id)+'"'+(p.categoryId===c.id?' selected':'')+'>'+esc(c.name)+'</option>'}).join('');
  var conds=['','Novo','Seminovo','Usado'].map(function(c){return '<option value="'+c+'"'+(p.condition===c?' selected':'')+'>'+(c||'Não informar')+'</option>'}).join('');
  var contactsList=(S.settings.contacts||[]);
  var selContact=p.contactId||(contactsList[0]||{}).id||'';
  var contactOpts=contactsList.map(function(c){
    return '<option value="'+esc(c.id)+'"'+(selContact===c.id?' selected':'')+'>'+esc(c.label||'Sem nome')+(c.number?' — '+esc(fmtPhone(c.number)):'')+(c.active?'':' [Inativo]')+'</option>';
  }).join('');
  var ph=(p.photos||[]).map(function(u,i){return '<div class="ph"><img src="'+esc(u)+'" alt="Foto '+(i+1)+'">'+(i?'<button class="btn ghost" data-action="ph-cover" data-i="'+i+'">Tornar capa</button>':'<span class="muted" style="font-size:13px;text-align:center">Capa</span>')+'<button class="btn ghost" data-action="ph-rm" data-i="'+i+'">Remover</button></div>'}).join('');
  return '<div class="panel" style="margin-bottom:14px"><h2 style="font-size:18px">'+(p.name?'Editar produto':'Novo produto')+'</h2><div class="form"><div class="field full"><label for="ed-name">Nome do produto</label><input class="inp" id="ed-name" data-f="name" value="'+esc(p.name)+'" placeholder="Ex.: Samsung Galaxy A54 5G"></div><div class="field"><label for="ed-brand">Marca</label><input class="inp" id="ed-brand" data-f="brand" value="'+esc(p.brand)+'"></div><div class="field"><label for="ed-model">Modelo</label><input class="inp" id="ed-model" data-f="model" value="'+esc(p.model)+'"></div><div class="field"><label for="ed-cat">Categoria</label><select class="inp" id="ed-cat" data-f="categoryId">'+opts+'</select></div><div class="field"><label for="ed-cond">Condição</label><select class="inp" id="ed-cond" data-f="condition">'+conds+'</select></div><div class="field full"><label for="ed-seller">Vendedor / WhatsApp de contato</label><select class="inp" id="ed-seller" data-f="contactId">'+(contactOpts||'<option value="">Nenhum vendedor cadastrado</option>')+'</select></div><div class="field full"><label for="ed-desc">Descrição</label><textarea class="inp" id="ed-desc" data-f="description">'+esc(p.description)+'</textarea></div><label class="check full" for="ed-feat"><input type="checkbox" id="ed-feat" data-f="featured"'+(p.featured?' checked':'')+'> Mostrar em destaque na página inicial</label></div><div class="field"><span class="lbl">Fotos (até 6)</span><div class="photos">'+ph+'</div>'+((p.photos||[]).length<6?'<div class="row" style="margin-top:6px"><label class="btn ghost" for="ed-files" style="cursor:pointer">Adicionar fotos</label><input class="sr" type="file" id="ed-files" accept="image/*" multiple></div>':'')+'<p class="muted" id="ph-msg" style="font-size:14px;margin-top:6px">'+esc(busy)+'</p></div><div class="row" style="margin:0"><button class="btn primary" data-action="p-done">Concluir</button></div></div>';
}
function adminCats(){
  var rows=S.categories.map(function(c){var n=prodsOf(c.id).length;return '<div class="arow"><div class="grow"><label class="sr" for="cn-'+esc(c.id)+'">Nome da categoria</label><input class="inp" id="cn-'+esc(c.id)+'" data-cn="'+esc(c.id)+'" value="'+esc(c.name)+'"><span class="muted" style="font-size:14px">'+n+(n===1?' produto':' produtos')+'</span></div><div class="acts"><button class="btn ghost sm" data-action="cat-del" data-id="'+esc(c.id)+'">Excluir</button></div></div>'}).join('');
  return '<div class="stack">'+rows+'</div><div class="row"><button class="btn primary" data-action="cat-add">Nova categoria</button></div><p class="note">Uma categoria só pode ser excluída quando não tem produtos. Categorias sem produtos aparecem para os clientes como Em breve.</p>';
}
function adminContact(){
  var rows=(S.settings.contacts||[]).map(function(c){
    return '<div class="panel"><div class="form"><div class="field"><label for="ct-l-'+esc(c.id)+'">Nome do Vendedor / Usuário</label><input class="inp" id="ct-l-'+esc(c.id)+'" data-ct="label" data-id="'+esc(c.id)+'" placeholder="Ex.: Daniel" value="'+esc(c.label)+'"></div><div class="field"><label for="ct-n-'+esc(c.id)+'">WhatsApp com DDD</label><input class="inp" id="ct-n-'+esc(c.id)+'" data-ct="number" data-id="'+esc(c.id)+'" inputmode="tel" placeholder="Ex.: 81 99493-2922" value="'+esc(fmtPhone(c.number))+'"></div></div><div class="row" style="margin:0;align-items:center"><label class="check" for="ct-a-'+esc(c.id)+'"><input type="checkbox" id="ct-a-'+esc(c.id)+'" data-ct="active" data-id="'+esc(c.id)+'"'+(c.active?' checked':'')+'> Vendedor ativo no site</label><button class="btn ghost sm" data-action="k-del" data-id="'+esc(c.id)+'">Remover</button></div></div>';
  }).join('');
  var msgs=[['msgInterest','Mensagem do botão Tenho interesse (use {produto} para o nome)'],['msgTrade','Mensagem do botão Quero trocar o meu (use {produto})'],['msgSell','Mensagem do botão Quero vender'],['msgSwap','Mensagem do botão Quero trocar'],['msgGeneral','Mensagem geral de contato']].map(function(m){return '<div class="field"><label for="m-'+m[0]+'">'+m[1]+'</label><textarea class="inp" id="m-'+m[0]+'" data-s="'+m[0]+'">'+esc(S.settings[m[0]])+'</textarea></div>'}).join('');
  return '<div class="stack"><div class="sec-h" style="margin-bottom:0"><div><h2 style="font-size:18px">Vendedores e Atendentes</h2><p class="muted" style="font-size:14px;margin-top:2px">Cadastre aqui os vendedores/usuários. Em cada produto você pode escolher para qual vendedor os clientes serão direcionados.</p></div></div>'+rows+'<div class="row" style="margin:0"><button class="btn primary" data-action="k-add">Adicionar novo vendedor / usuário</button></div><div class="panel" style="margin-top:8px"><div class="field"><label for="mode">Quando houver contato geral (sem produto específico)</label><select class="inp" id="mode" data-s="mode"><option value="primeiro"'+(S.settings.mode==='primeiro'?' selected':'')+'>Usar o primeiro vendedor ativo</option><option value="alternado"'+(S.settings.mode==='alternado'?' selected':'')+'>Alternar entre os vendedores ativos</option></select></div></div><h2 style="font-size:18px;margin-top:14px">Mensagens automáticas</h2><div class="panel">'+msgs+'</div></div>';
}
function updateBar(){
  var b=$('#pubbar');if(!b)return;
  b.hidden=!dirty;
  var m=$('#pubmsg');if(m)m.textContent=busy==='publicando'?'Publicando…':'Você tem alterações não publicadas.';
}
function markDirty(){dirty=true;updateBar()}

/* ---------- photos ---------- */
function cap(name){try{return window.claude&&window.claude.use?window.claude.use(name).catch(function(){return null}):Promise.resolve(null)}catch(e){return Promise.resolve(null)}}
function shrink(file){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      var r=Math.min(1,1000/Math.max(img.naturalWidth,img.naturalHeight)),c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(img.naturalWidth*r));c.height=Math.max(1,Math.round(img.naturalHeight*r));
      var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
      c.toBlob(function(b){URL.revokeObjectURL(url);b?res(b):rej(new Error('blob'))},'image/jpeg',.82);
    };
    img.onerror=function(){URL.revokeObjectURL(url);rej(new Error('img'))};
    img.src=url;
  });
}
function keep(blob){
  if(!SB)return Promise.reject(new Error('sb'));
  var path=uid('f')+Date.now().toString(36)+'.jpg';
  return SB.storage.from('photos').upload(path,blob,{contentType:'image/jpeg',cacheControl:'31536000'}).then(function(r){
    if(r.error)throw r.error;
    return SB.storage.from('photos').getPublicUrl(path).data.publicUrl;
  });
}
function addPhotos(files){
  var p=S.products.filter(function(x){return x.id===editing})[0];if(!p)return;
  p.photos=p.photos||[];
  var list=Array.prototype.slice.call(files).slice(0,6-p.photos.length),i=0;
  function next(){
    if(i>=list.length){busy='';markDirty();render();return}
    busy='Enviando foto '+(i+1)+' de '+list.length+'…';var m=$('#ph-msg');if(m)m.textContent=busy;
    shrink(list[i]).then(keep).then(function(u){p.photos.push(u);i++;next()}).catch(function(){i++;toast('Não foi possível usar uma das imagens.');next()});
  }
  next();
}

/* ---------- publish ---------- */
function buildDoc(){
  var style=$('#gr-style').textContent,script=$('#gr-script').textContent,fonts=$('#gr-fonts').outerHTML;
  var data=JSON.stringify(S).replace(/</g,'\\u003c');
  return '<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>'+TITLE+'</title><meta name="theme-color" content="#FFFFFF"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Giro Rápido"><link rel="manifest" href="/manifest.json"><link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png"><link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png"><link rel="apple-touch-icon" href="/icon-192.png">'+fonts+'<style>'+RESET+'</style><style id="gr-style">'+style+'</style></head><body><div id="app"></div><div id="toast" class="toast" role="status" aria-live="polite" hidden></div><script type="application/json" id="gr-data">'+data+'<\/script><script id="gr-script">'+script+'<\/script></body></html>';
}
function publish(){
  if(busy==='publicando')return;
  if(!SB){toast('Supabase não configurado. Preencha o arquivo config.js.');return}
  var bad=S.products.filter(function(p){return !p.name});
  if(bad.length){S.products=S.products.filter(function(p){return p.name});if(editing&&!S.products.some(function(p){return p.id===editing}))editing=null}
  S.demo=S.products.some(function(p){return p.demo});
  busy='publicando';updateBar();
  SB.from('site_data').upsert({id:1,data:S,updated_at:new Date().toISOString()}).then(function(r){
    if(r.error)throw r.error;
    busy='';dirty=false;orig=JSON.stringify(S);
    toast('Alterações publicadas. O site já está atualizado para todos.');render();
  }).catch(function(e){
    busy='';
    var m='Não foi possível publicar agora. Tente de novo em instantes.';
    if(e&&(e.code==='42501'||e.status===401||e.status===403)){m='Sua sessão expirou. Entre novamente.';canEdit=false}
    toast(m);updateBar();render();
  });
}
function login(){
  var e=(($('#lg-email')||{}).value||'').trim(),p=($('#lg-pass')||{}).value||'';
  if(!SB){toast('Supabase não configurado. Preencha o arquivo config.js.');return}
  if(!e||!p){toast('Informe e-mail e senha.');return}
  SB.auth.signInWithPassword({email:e,password:p}).then(function(r){
    if(r.error){
      console.error('Supabase auth error:', r.error);
      var m='E-mail ou senha incorretos.';
      var msgLower=(r.error.message||'').toLowerCase();
      if(msgLower.indexOf('confirm')>=0){m='E-mail ainda não confirmado no painel do Supabase.'}
      toast(m);return;
    }
    canEdit=true;render();
  }).catch(function(err){console.error('Login error:', err);toast('Não foi possível entrar agora.')});
}
function logout(){
  canEdit=false;dirty=false;
  try{
    sessionStorage.clear();
    for(var k in localStorage){if(k.indexOf('sb-')===0||k.indexOf('supabase')>=0)localStorage.removeItem(k)}
  }catch(e){}
  if(SB){SB.auth.signOut().finally(function(){canEdit=false;toast('Você saiu da administração.');render();})}
  else{canEdit=false;toast('Você saiu da administração.');render();}
}

/* ---------- render + events ---------- */
function render(){
  var m;
  switch(route){case 'catalogo':m=catalog();break;case 'categorias':m=categories();break;case 'produto':m=product();break;case 'admin':m=admin();break;default:m=home()}
  $('#app').innerHTML=header()+'<main id="main">'+m+'</main>'+footer();
  if(route==='catalogo')renderGrid();
  if(route==='admin')updateBar();
  updatePwaBtns();
}
document.addEventListener('click',function(ev){
  var pwaBtn=ev.target.closest&&ev.target.closest('.pwa-btn, #pwa-btn, #pwa-foot-btn');
  if(pwaBtn){ev.preventDefault();triggerInstall();return}
  var a=ev.target.closest&&ev.target.closest('a[href^="#"]');
  if(a&&a.getAttribute('href').length>1&&!ev.defaultPrevented&&!ev.metaKey&&!ev.ctrlKey){ev.preventDefault();go(a.getAttribute('href').slice(1));return}
  var b=ev.target.closest&&ev.target.closest('[data-action]');if(!b)return;
  var act=b.dataset.action,id=b.dataset.id,i=Number(b.dataset.i);
  var cur=function(){return S.products.filter(function(p){return p.id===editing})[0]};
  switch(act){
    case 'cat':F.cat=id;F.brand='';F.q='';go('catalogo');break;
    case 'chip':F.cat=id;F.brand='';render();break;
    case 'clear':F={q:'',cat:'',brand:'',seller:''};render();break;
    case 'gal':gal=i;render();break;
    case 'copy':
      var el=document.getElementById('num-'+b.dataset.n),txt=el?el.textContent:'';
      var sel=function(){if(el){var r=document.createRange();r.selectNodeContents(el);var s=getSelection();s.removeAllRanges();s.addRange(r)}toast('Número selecionado. Copie e cole no WhatsApp.')};
      try{navigator.clipboard.writeText(txt).then(function(){toast('Número copiado.')},sel)}catch(e){sel()}
      break;
    case 'tab':adminTab=b.dataset.t;editing=null;confirmDel=null;render();break;
    case 'p-new':
      var defaultContact=(S.settings.contacts[0]||{}).id||'';
      var np={id:uid('p'),name:'',brand:'',model:'',categoryId:(S.categories[0]||{}).id||'',contactId:defaultContact,condition:'',description:'',photos:[],featured:false};
      S.products.unshift(np);editing=np.id;markDirty();render();break;
    case 'p-edit':editing=id;confirmDel=null;render();break;
    case 'p-done':var p=cur();if(p&&!p.name){S.products=S.products.filter(function(x){return x!==p});toast('Produto sem nome não foi salvo.')}editing=null;render();break;
    case 'p-del':confirmDel=id;render();break;
    case 'p-del-no':confirmDel=null;render();break;
    case 'p-del-yes':S.products=S.products.filter(function(x){return x.id!==id});confirmDel=null;markDirty();render();break;
    case 'ph-rm':var c1=cur();if(c1){c1.photos.splice(i,1);markDirty();render()}break;
    case 'ph-cover':var c2=cur();if(c2){var x=c2.photos.splice(i,1)[0];c2.photos.unshift(x);markDirty();render()}break;
    case 'demo-clear':S.products=S.products.filter(function(x){return !x.demo});S.demo=false;editing=null;markDirty();render();break;
    case 'cat-add':S.categories.push({id:uid('c'),name:'Nova categoria'});markDirty();render();break;
    case 'cat-del':
      if(prodsOf(id).length||S.products.some(function(p){return p.categoryId===id})){toast('Mova ou exclua os produtos desta categoria antes de excluí-la.')}
      else{S.categories=S.categories.filter(function(c){return c.id!==id});markDirty();render()}
      break;
    case 'k-add':S.settings.contacts.push({id:uid('u'),label:'Novo vendedor',number:'',active:true});markDirty();render();break;
    case 'k-del':S.settings.contacts=S.settings.contacts.filter(function(c){return c.id!==id});markDirty();render();break;
    case 'discard':S=JSON.parse(orig);dirty=false;editing=null;confirmDel=null;render();toast('Alterações descartadas.');break;
    case 'publish':publish();break;
    case 'logout':logout();break;
  }
});
document.addEventListener('submit',function(ev){
  if(ev.target.hasAttribute&&ev.target.hasAttribute('data-login')){ev.preventDefault();login()}
});
document.addEventListener('input',function(ev){
  var t=ev.target;
  if(t.hasAttribute('data-q')){F.q=t.value;renderGrid();return}
  if(t.dataset.f){var p=S.products.filter(function(x){return x.id===editing})[0];if(p){p[t.dataset.f]=t.type==='checkbox'?t.checked:t.value;markDirty()}return}
  if(t.dataset.s){S.settings[t.dataset.s]=t.value;markDirty();return}
  if(t.dataset.cn){var c=S.categories.filter(function(x){return x.id===t.dataset.cn})[0];if(c){c.name=t.value;markDirty()}return}
  if(t.dataset.ct&&t.dataset.ct!=='number'){var k=S.settings.contacts.filter(function(x){return x.id===t.dataset.id})[0];if(k){k[t.dataset.ct]=t.type==='checkbox'?t.checked:t.value;markDirty()}}
});
document.addEventListener('change',function(ev){
  var t=ev.target;
  if(t.hasAttribute('data-brand')){F.brand=t.value;renderGrid();return}
  if(t.hasAttribute('data-seller')){F.seller=t.value;renderGrid();return}
  if(t.id==='ed-files'){if(t.files&&t.files.length)addPhotos(t.files);return}
  if(t.dataset.f){var p=S.products.filter(function(x){return x.id===editing})[0];if(p){p[t.dataset.f]=t.type==='checkbox'?t.checked:t.value;markDirty()}return}
  if(t.dataset.s){S.settings[t.dataset.s]=t.value;markDirty();return}
  if(t.dataset.ct==='number'){
    var k=S.settings.contacts.filter(function(x){return x.id===t.dataset.id})[0];
    if(k){var d=digits(t.value);if(d.length===10||d.length===11)d='55'+d;k.number=d;t.value=fmtPhone(d);markDirty()}
  }
});

/* ---------- pwa ---------- */
var deferredPrompt=null;
window.addEventListener('beforeinstallprompt',function(e){
  e.preventDefault();
  deferredPrompt=e;
  updatePwaBtns();
});
window.addEventListener('appinstalled',function(){
  deferredPrompt=null;
  updatePwaBtns();
  toast('Aplicativo Giro Rápido instalado com sucesso!');
});
function isIos(){
  return /iphone|ipad|ipod/i.test(navigator.userAgent)&&!window.MSStream;
}
function isInStandaloneMode(){
  return ('standalone' in window.navigator&&window.navigator.standalone)||window.matchMedia('(display-mode: standalone)').matches;
}
function updatePwaBtns(){
  var show=!isInStandaloneMode()&&(!!deferredPrompt||isIos());
  var b1=document.getElementById('pwa-btn');
  var b2=document.getElementById('pwa-foot-btn');
  if(b1)b1.style.display=show?'inline-flex':'none';
  if(b2)b2.style.display=show?'inline-flex':'none';
}
function triggerInstall(){
  if(deferredPrompt){
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(function(){
      deferredPrompt=null;
      updatePwaBtns();
    });
  }else if(isIos()){
    toast('Para instalar no iPhone/iPad: toque em Compartilhar e depois em "Adicionar à Tela de Início".');
  }else{
    toast('Abra o menu do navegador e toque em "Instalar aplicativo" ou "Adicionar à tela inicial".');
  }
}
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('/sw.js',{scope:'/'}).then(function(reg){
      console.log('PWA ServiceWorker ativo:',reg.scope);
      if(reg.update)reg.update();
    }).catch(function(err){
      console.log('Falha ao registrar ServiceWorker:',err);
    });
  });
}

/* ---------- boot ---------- */
parseHash();
try{if(sessionStorage.getItem('gr_flash')){route='admin'}}catch(e){}
render();
if(SB){
  SB.from('site_data').select('data').eq('id',1).maybeSingle().then(function(r){
    if(r&&r.data&&r.data.data&&r.data.data.settings&&!dirty&&!editing){S=r.data.data;orig=JSON.stringify(S);render();if(route==='catalogo')renderGrid()}
  }).catch(function(){});
  SB.auth.getSession().then(function(r){
    canEdit=!!(r&&r.data&&r.data.session);
    if(!dirty&&!editing)render();
  }).catch(function(){});
  SB.auth.onAuthStateChange(function(ev,s){
    var v=!!s;if(v===canEdit)return;
    canEdit=v;if(!dirty&&!editing)render();
  });
}
})();
</script>
